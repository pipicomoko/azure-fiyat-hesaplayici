{% extends "taban.html" %}

{% block baslik %}{{ t('giris_baslik', dil) }} - {{ t('uygulama_adi', dil) }}{% endblock %}

{% block icerik %}
<div class="login-wrap">
  <section class="ui-card">
    <div class="ui-card__body">
      <h1 class="ui-card__title" style="margin-bottom: var(--space-4)">{{ t('giris_baslik', dil) }}</h1>

      {% if hata %}
      <div class="ui-alert ui-alert--danger" style="margin-bottom: var(--space-4)">{{ hata }}</div>
      {% endif %}

      <form method="post" action="/giris" class="rail-stack">
        <div>
          <label class="ui-label" for="kullanici_adi">{{ t('giris_kullanici_adi', dil) }}</label>
          <input type="text" class="ui-input" id="kullanici_adi" name="kullanici_adi" required autofocus>
        </div>
        <div>
          <label class="ui-label" for="sifre">{{ t('giris_sifre', dil) }}</label>
          <input type="password" class="ui-input" id="sifre" name="sifre" required>
        </div>
        <button type="submit" class="ui-btn ui-btn--primary" style="width: 100%">{{ t('giris_buton', dil) }}</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}

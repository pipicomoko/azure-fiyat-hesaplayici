<!doctype html>
<html lang="{{ dil }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block baslik %}{{ t('uygulama_adi', dil) }}{% endblock %}</title>
  <script>
    (function () {
      const storedTheme = localStorage.getItem('theme-preference');
      const theme = storedTheme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  {# BUG-09: Bootstrap/htmx yerel static; CDN/Google Fonts yok (offline + SRI riski) #}
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css?v={{ statik_surum('vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="/static/globals.css?v={{ statik_surum('globals.css') }}">
  <link rel="stylesheet" href="/static/app.css?v={{ statik_surum('app.css') }}">
  <script src="/static/vendor/htmx/htmx.min.js?v={{ statik_surum('vendor/htmx/htmx.min.js') }}"></script>
  <script>
    document.addEventListener('htmx:configRequest', function (evt) {
      var meta = document.querySelector('meta[name="csrf-token"]');
      if (meta && meta.content) {
        evt.detail.headers['X-CSRF-Token'] = meta.content;
      }
    });
  </script>
</head>
<body class="app-body">
  {% include "_nav.html" %}
  <main class="app-shell">
    {% block icerik %}{% endblock %}
  </main>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js?v={{ statik_surum('vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script src="/static/app.js?v={{ statik_surum('app.js') }}"></script>
</body>
</html>

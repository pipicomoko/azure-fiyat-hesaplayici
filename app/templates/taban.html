<!doctype html>
<html lang="{{ dil }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block baslik %}{{ t('uygulama_adi', dil) }}{% endblock %}</title>
  <script>
    (function () {
      const storedTheme = localStorage.getItem('theme-preference');
      const theme = storedTheme === 'dark' || storedTheme === 'light' || storedTheme === 'pink' ? storedTheme : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="app-body">
  {% include "_nav.html" %}
  <main class="app-shell container-fluid px-3 px-lg-4 pb-5">
    {% block icerik %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

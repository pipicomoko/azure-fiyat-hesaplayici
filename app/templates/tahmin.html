{% extends "taban.html" %}

{% block baslik %}{{ t('tahmin_baslik', dil) }} - {{ t('uygulama_adi', dil) }}{% endblock %}

{% block icerik %}
<form id="tahmin-formu" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {% include "_tahmin_ic_icerik.html" %}
</form>

<script>
function tahminToplamiGuncelle() {
  const kalemler = document.querySelectorAll('#tahmin-govdesi .tahmin-kalemi');
  let toplam = 0;
  kalemler.forEach(function (kalem) {
    toplam += parseFloat(kalem.dataset.tutar || '0');
  });
  const paraBirimi = 'USD';
  const aylikMetin = typeof formatCurrency === 'function'
    ? formatCurrency(toplam, paraBirimi)
    : (toplam.toFixed(2) + ' ' + paraBirimi);
  const yillikMetin = typeof formatCurrency === 'function'
    ? formatCurrency(toplam * 12, paraBirimi)
    : ((toplam * 12).toFixed(2) + ' ' + paraBirimi);

  const toplamElemani = document.getElementById('tahmin-toplam');
  const yillikToplamElemani = document.getElementById('tahmin-yillik-toplam');
  const sidebarTotal = document.getElementById('sidebar-aylik-toplam');
  const sidebarYearly = document.getElementById('sidebar-yillik-toplam');
  const sidebarCount = document.getElementById('sidebar-kalem-sayisi');

  if (toplamElemani) toplamElemani.textContent = aylikMetin;
  if (yillikToplamElemani) yillikToplamElemani.textContent = yillikMetin;
  if (sidebarTotal) sidebarTotal.textContent = aylikMetin;
  if (sidebarYearly) sidebarYearly.textContent = yillikMetin;
  if (sidebarCount) sidebarCount.textContent = String(kalemler.length);

  if (typeof syncSummaryTotals === 'function') {
    syncSummaryTotals();
  }
  const bosMesaji = document.getElementById('tahmin-bos-mesaji');
  if (bosMesaji) {
    bosMesaji.style.display = kalemler.length > 0 ? 'none' : '';
  }
  const disaAktarButonu = document.getElementById('disa-aktar-butonu');
  if (disaAktarButonu) {
    disaAktarButonu.disabled = kalemler.length === 0;
  }
}
document.body.addEventListener('htmx:afterSwap', tahminToplamiGuncelle);
document.body.addEventListener('htmx:afterSettle', tahminToplamiGuncelle);
tahminToplamiGuncelle();
</script>
{% endblock %}

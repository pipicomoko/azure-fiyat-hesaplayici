name: Build and push image

# GitOps oncesi iskelet: imaji registry'ye iter. Argo CD ayri adim.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Manifesti guncelle ve commitle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sed -i "s|image: ghcr.io/.*azure-fiyat-hesaplayici:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|g" \
            k8s/app-deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/app-deployment.yaml
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlaniyor"
          else
            git commit -m "ci: imaj etiketi ${{ github.sha }} [skip ci]"
            git push
          fi

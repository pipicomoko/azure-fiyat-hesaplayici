# Argo CD Application — yalnizca Argo kurulduktan sonra uygulanir:
#   kubectl apply -f k8s/argocd-application.yaml
# Bu dosya kume workload'larina dahil edilmez (asagidaki directory.exclude).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: afh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pipicomoko/azure-fiyat-hesaplayici.git
    targetRevision: main
    path: k8s
    directory:
      exclude: "{argocd-application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: afh
  syncPolicy:
    automated:
      prune: false
      selfHeal: false

# AFH uygulama imaji — Minikube ogrenme kurulumu
#
# Secret kume icinde olusturulur, Git'e yazilmaz:
#   kubectl -n afh create secret generic afh-secrets \
#     --from-literal=secret-key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=database-url='postgresql+psycopg://apc:apc@postgres:5432/apc'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: afh-app
  namespace: afh
  labels:
    app: afh
spec:
  replicas: 3
  selector:
    matchLabels:
      app: afh
  template:
    metadata:
      labels:
        app: afh
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: postgres-bekle
          image: ghcr.io/pipicomoko/azure-fiyat-hesaplayici:3622274034998e3c4ff0a5e90d5118432eb5e72a
          command:
            - python
            - -c
            - |
              import socket, sys, time
              for _ in range(60):
                  try:
                      socket.create_connection(("postgres", 5432), 2).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit(1)
        - name: samba-bekle
          image: ghcr.io/pipicomoko/azure-fiyat-hesaplayici:3622274034998e3c4ff0a5e90d5118432eb5e72a
          command:
            - python
            - -c
            - |
              import socket, sys, time
              for _ in range(180):
                  try:
                      socket.create_connection(("samba", 389), 2).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit(1)
      containers:
        - name: app
          image: ghcr.io/pipicomoko/azure-fiyat-hesaplayici:3622274034998e3c4ff0a5e90d5118432eb5e72a
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: development
            - name: LDAP_TLS_MODU
              value: kapali
            - name: LDAP_SUNUCU
              valueFrom:
                configMapKeyRef:
                  name: afh-config
                  key: ldap-sunucu
            - name: LDAP_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: afh-config
                  key: ldap-domain
            - name: LDAP_ARAMA_TABANI
              valueFrom:
                configMapKeyRef:
                  name: afh-config
                  key: ldap-arama-tabani
            - name: LDAP_PORT
              valueFrom:
                configMapKeyRef:
                  name: afh-config
                  key: ldap-port
            - name: GENEL_MUDUR_SAM
              valueFrom:
                configMapKeyRef:
                  name: afh-config
                  key: genel-mudur-sam
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: afh-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: afh-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /saglik
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /canli
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: afh-config
  namespace: afh
data:
  ldap-sunucu: "samba"
  ldap-domain: "sirket.local"
  ldap-arama-tabani: "DC=sirket,DC=local"
  ldap-port: "389"
  genel-mudur-sam: "ahmet.yildirim"
---
apiVersion: v1
kind: Service
metadata:
  name: afh-app
  namespace: afh
spec:
  selector:
    app: afh
  ports:
    - port: 80
      targetPort: 8000
